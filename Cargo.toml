[package]
name = "herdr-team"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap-stdin = "0.8"
derive_more = { version = "2", features = ["from", "display", "as_ref", "deref"] }
getter-methods = "2.0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"

[dev-dependencies]
tempfile = "3.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
